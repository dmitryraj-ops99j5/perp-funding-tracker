name: sync-docs

on:
  schedule:
    - cron: "57 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-docs
  cancel-in-progress: false

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refresh
        run: |
          set -eu
          sleep $(( RANDOM % 900 ))
          f="README.md"
          [ -f "$f" ] || exit 0
          stamp="<!-- updated: $(date -u +%Y-%m-%d) -->"
          if grep -q "^<!-- updated: " "$f"; then
            sed -i "s|^<!-- updated: .*|$stamp|" "$f"
          else
            printf '\n%s\n' "$stamp" >> "$f"
          fi

      - name: commit
        run: |
          set -eu
          git config user.name "dmitryraj-ops99j5"
          git config user.email "279186032+dmitryraj-ops99j5@users.noreply.github.com"
          set -- "chore: refresh metadata" "docs: update generated marker" "chore: scheduled refresh" "docs: touch up" "chore: periodic update"
          n=$(( ${GITHUB_RUN_NUMBER:-0} % $# + 1 ))
          eval msg=\${$n}
          git add -- "README.md"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$msg"
          git push
